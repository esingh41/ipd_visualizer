<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IPD Visualizer — Trajectory</title>
    <link rel="stylesheet" href="/viewer.css" />
    <!-- Unpinned, matching what index_old.html has always loaded. Pinning this to a
         confirmed release is a follow-up. -->
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
    <script type="module" src="/viewer.js"></script>
  </head>
  <body>
    <header>
      <h1>Trajectory</h1>
      <p id="status" class="status" role="status"></p>
    </header>

    <main>
      <section class="controls">
        <label class="field">
          <span>Upload a dataframe</span>
          <input id="file-input" type="file" accept=".pkl,.pickle" />
        </label>

        <label class="field">
          <span>Collection</span>
          <select id="collection-select" disabled></select>
        </label>

        <label class="field">
          <span>System</span>
          <select id="system-select" disabled></select>
        </label>
      </section>

      <section class="viewer-panel">
        <div id="viewer" class="viewer"></div>

        <div class="playback">
          <button id="play-button" type="button" disabled aria-label="Play">▶</button>
          <input
            id="frame-slider"
            type="range"
            min="0"
            max="0"
            value="0"
            step="1"
            disabled
            aria-label="Frame"
          />
          <span id="frame-label" class="frame-label"></span>
        </div>

        <!-- These change what is drawn in 3D, so they live with the viewer rather than in the
             multipole table below it. -->
        <div class="overlays">
          <span class="overlays-title">Viewer overlays</span>

          <fieldset class="overlay-group">
            <legend>Dipoles</legend>
            <label class="swatch-label">
              <input id="show-monomer-dipoles" type="checkbox" />
              <span class="swatch swatch-monomer"></span>Monomer
            </label>
            <label class="swatch-label">
              <input id="show-dimer-dipoles" type="checkbox" />
              <span class="swatch swatch-dimer"></span>Dimer
            </label>
            <label class="swatch-label">
              <input id="show-delta-dipoles" type="checkbox" />
              <span class="swatch swatch-delta"></span>Δ Dimer − Monomer
            </label>
          </fieldset>

          <fieldset class="overlay-group">
            <legend>Charge labels</legend>
            <select id="charge-label-mode">
              <option value="none">None</option>
              <option value="monomer">Monomer</option>
              <option value="dimer">Dimer</option>
              <option value="delta">Difference</option>
            </select>
          </fieldset>
        </div>
      </section>

      <!-- Native <details>, so there is no expanded/collapsed state for JavaScript to keep. -->
      <details id="multipole-section" class="multipoles">
        <summary>Atomic Multipoles</summary>

        <div class="multipole-controls">
          <div class="button-group" id="multipole-views" role="group" aria-label="Quantity">
            <button type="button" data-view="charges" class="active">Charges</button>
            <button type="button" data-view="dipoles">Dipoles</button>
            <button type="button" data-view="volume_ratios">Volume ratios</button>
          </div>

          <div class="button-group" id="atom-filters" role="group" aria-label="Atoms">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="A">A</button>
            <button type="button" data-filter="B">B</button>
          </div>
        </div>

        <div id="multipole-content">
          <p id="multipole-message" class="multipole-message" hidden></p>
          <div class="table-scroll">
            <table id="multipole-table">
              <thead id="multipole-table-head"></thead>
              <tbody id="multipole-table-body"></tbody>
            </table>
          </div>
        </div>
      </details>
    </main>
  </body>
</html>
